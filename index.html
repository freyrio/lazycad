<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>BlueprintForge</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/serializers/babylonjs.serializers.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
</head>
<body>
  <div id="app">
    <header id="top-bar"></header>
    <main id="viewport-container">
      <div id="viewport-2d" class="viewport">
        <canvas id="layer-bitmap" class="viewport-layer"></canvas>
        <canvas id="layer-grid" class="viewport-layer"></canvas>
        <canvas id="layer-vectors" class="viewport-layer"></canvas>
        <canvas id="layer-interaction" class="viewport-layer"></canvas>
      </div>
      <div id="viewport-3d" class="viewport hidden">
        <canvas id="canvas-3d" class="viewport-layer"></canvas>
      </div>
    </main>
    <div id="floor-manager"></div>
    <nav id="bottom-toolbar"></nav>
    <aside id="property-panel" class="hidden"></aside>
    <div id="bottom-sheet" class="hidden"></div>
    <div id="toast-container"></div>
    <div id="modal-overlay" class="hidden"></div>
  </div>

  <input type="file" id="file-input" accept="image/*,.pdf" style="display:none">
  <input type="file" id="project-input" accept=".bpf.json,.json" style="display:none">

  <script type="module" src="src/app.js"></script>
  <script>
    // Register service worker for offline capability
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
